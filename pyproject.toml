[project]
name = "pulse-discovery-agent"
version = "0.1.0"
description = "An AI agent that learns, per venue, where a city's events are published — and records the recipe."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "openai>=1.40.0",          # model-agnostic client via an OpenAI-compatible base_url (OpenRouter, etc.)
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.4.0",
    "icalendar>=7.2.2",
    "python-dateutil>=2.9.0.post0",
]

[project.scripts]
discovery-agent = "discovery_agent.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discovery_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
