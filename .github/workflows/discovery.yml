name: Discovery

# Two loops on one schedule (workshop roadmap M4):
#   harvest — nightly, deterministic, free: run every known recipe, stage events
#   scout   — weekly, paid: investigate publishers that have no recipe yet
#
# Split deliberately. Harvest is cheap and must run often; scouting costs money per
# publisher, so it runs on a smaller cadence with an explicit cap and can always be
# triggered by hand when the demand queue fills up.

on:
  schedule:
    - cron: "15 3 * * *"    # 03:15 UTC nightly — harvest
    # Weekly scout is PAUSED (2026-08-13). It works, but its hit rate does not yet
    # justify standing spend: across 43 logged runs it found 10 recipes and 7
    # Instagram leads for $3.27 — successes cost $0.04 on average, failures $0.11,
    # and failures outnumber successes two to one. Harvest is unaffected: it costs
    # nothing, needs no LLM key, and keeps the existing recipes producing events.
    #
    # Re-enable by uncommenting this ONE line. The scout job below still tests for
    # this cron string in its `if:` — that condition is deliberately left in place
    # so re-enabling needs no second edit. Do not "clean it up".
    # Until then the scout still runs on demand via workflow_dispatch (job: scout),
    # which is how the pilot and the demo run it.
    # - cron: "45 4 * * 1"    # 04:45 UTC Mondays — scout
  workflow_dispatch:
    inputs:
      job:
        description: "Which loop to run"
        type: choice
        options: [harvest, scout]
        default: harvest
      limit:
        description: "Publishers to scout (scout only)"
        default: "25"
      mix:
        description: "Draw a category-stratified sample (scout only)"
        type: boolean
        default: true

concurrency:
  group: discovery
  cancel-in-progress: false      # never interrupt a run mid-write

jobs:
  harvest:
    if: >
      github.event.schedule == '15 3 * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'harvest')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
    steps:
      # Both loops need a database. Without one, skip with a notice instead of a
      # nightly red X: an unconfigured optional job is not a failure, and a mirror
      # of this repo (the course submission) will never have these secrets.
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No SUPABASE_URL secret — discovery is not configured here, skipping."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.configured == 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.configured == 'true'
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e .
        if: steps.cfg.outputs.configured == 'true'
      - name: Harvest known recipes
        if: steps.cfg.outputs.configured == 'true'
        run: discovery-agent harvest

  scout:
    if: >
      github.event.schedule == '45 4 * * 1' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'scout')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
    steps:
      # Scouting additionally SPENDS MONEY, so it refuses to start without an LLM
      # key rather than burning a run to discover that halfway through.
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Scouting needs SUPABASE_URL and OPENROUTER_API_KEY — skipping."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.configured == 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.configured == 'true'
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e .
        if: steps.cfg.outputs.configured == 'true'
      - name: Scout unscouted publishers
        if: steps.cfg.outputs.configured == 'true'
        env:
          LANGFUSE_ENVIRONMENT: production   # keep ad-hoc local runs out of this dashboard
        run: |
          discovery-agent scout \
            --limit "${{ inputs.limit || 25 }}" \
            ${{ (inputs.mix == false) && ' ' || '--mix' }}
      - name: Pilot report
        if: steps.cfg.outputs.configured == 'true'
        run: python scripts/pilot_report.py
