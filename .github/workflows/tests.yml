name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # The suite must pass with no DB, no network, and no API key — that property
      # is what makes this repo independently runnable, so CI enforces it by
      # simply never providing any of them.
      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Lint
        run: |
          pip install ruff
          ruff check .
