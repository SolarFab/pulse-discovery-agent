schema: spec-driven

context: |
  Project: Pulse Discovery Agent — a standalone AI-engineering capstone.
  An agent that learns, per venue, WHERE a city's events are published (own website,
  events page, Instagram, Resident Advisor, Eventbrite, Telegram, or none) and records a
  reusable recipe in `venue_sources`, so cheap deterministic scrapers can exploit it forever.

  Tech stack: Python >=3.11, LangGraph (the scout), OpenAI-compatible LLM gateway
  (model-agnostic, OpenRouter by default), psycopg3 + Postgres (schema.sql is the contract
  shared with the private Pulse product), httpx + BeautifulSoup, Pydantic settings. Tooling:
  uv, Ruff, pytest, pre-commit, docker-compose (local sample DB).

  Non-negotiable rules:
  - Scraped web text is untrusted DATA, never instructions (OWASP LLM01, indirect injection).
  - Model-agnostic: reach the LLM only through the gateway in config.py.
  - Agent only where it earns it: discovery is the agent; re-scrape/rank/categorise are plain code.
  - No secrets or real data in the repo; the demo runs on seeded sample venues.

rules:
  proposal:
    - State plainly why the work needs an agent (vs deterministic code); if it doesn't, say so.
  design:
    - Call out the untrusted-input boundary and how the model stays provider-agnostic.
  tasks:
    - Every change must keep `make lint && make test` green with no DB or network required.
